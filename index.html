<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Siatka">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>Siatka Liczb</title>
<style>
/* Layout: one-screen arcade board — status bar, square grid, controls under it. Deliberate single purple look. */
:root{
  --bg:#ffffff; --bg2:#ffffff; --cell:#f1f1f4; --cell-hi:#e6e6ec;
  --fg:#111114; --muted:#6b6b76; --accent:#111114; --bad:#ff4d6a; --good:#14a058; --line:#dcdce3;
  --f-display:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --f-body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px;box-sizing:border-box;display:flex;justify-content:center}
.wrap{width:100%;max-width:560px;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--f-display);font-weight:700;font-size:1.25rem;margin:0;letter-spacing:.02em;text-wrap:balance}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--cell);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.stat span{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.stat b{font-family:var(--f-display);font-size:1.15rem;font-variant-numeric:tabular-nums}
#next{color:var(--fg)}
.board{display:grid;gap:5px;width:100%;aspect-ratio:1;max-width:100%;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.c{border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--fg);font-family:var(--f-display);font-weight:500;
  font-size:clamp(.85rem,4.2vw,1.4rem);cursor:pointer;padding:0;transition:background .12s,transform .08s;-webkit-tap-highlight-color:transparent}
.c:hover{background:var(--cell-hi)}
.c:active{transform:scale(.94)}
.c:focus-visible{outline:3px solid #7a7aff;outline-offset:1px}
.c.gone{background:var(--cell);border-color:transparent;color:transparent;cursor:default;pointer-events:none}
.c.blank{pointer-events:none;cursor:default}
.c.wrong{background:var(--bad);color:#fff;animation:shake .25s}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sizes{display:flex;gap:6px}
.sz,.go{font-family:var(--f-body);font-weight:700;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--fg);padding:9px 12px;cursor:pointer;font-size:.9rem}
.sz[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.go{margin-left:auto;background:var(--fg);color:var(--bg);border-color:transparent}
.sz:focus-visible,.go:focus-visible{outline:3px solid #7a7aff;outline-offset:2px}
.msg{min-height:1.4em;margin:0;color:var(--muted);font-size:.9rem}
.msg.win{color:var(--good);font-weight:700}
@media (prefers-reduced-motion:reduce){.c{transition:none}.c.wrong{animation:none}}
</style>
</head>
<body>

<div class="wrap">
  <h1>Siatka Liczb</h1>
  <div class="stats">
    <div class="stat"><span>Szukaj</span><b id="next">1</b></div>
    <div class="stat"><span>Czas</span><b id="time">0.00</b></div>
    <div class="stat"><span>Rekord</span><b id="best">—</b></div>
  </div>
  <div class="board" id="board" aria-label="Siatka liczb"></div>
  <p class="msg" id="msg">Naciśnij Start — liczby pojawią się i ruszy stoper.</p>
  <div class="controls">
    <div class="sizes" role="group" aria-label="Rozmiar siatki">
      <button class="sz" id="sz5" data-n="5">5×5</button>
      <button class="sz" id="sz6" data-n="6">6×6</button>
      <button class="sz" id="sz7" data-n="7">7×7</button>
    </div>
    <button class="go" id="go">Start</button>
  </div>
</div>

<script>
(function(){
  const board=document.getElementById('board'),nextEl=document.getElementById('next'),
        timeEl=document.getElementById('time'),bestEl=document.getElementById('best'),
        msg=document.getElementById('msg');
  let n=7,next=1,start=0,raf=0,errors=0,running=false;

  const getBest=k=>{try{return parseFloat(localStorage.getItem('best'+k))||null}catch(e){return null}};
  const setBest=(k,v)=>{try{localStorage.setItem('best'+k,v)}catch(e){}};
  try{const s=parseInt(localStorage.getItem('size'));if([5,6,7].includes(s))n=s}catch(e){}

  function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
  function tick(){timeEl.textContent=((performance.now()-start)/1000).toFixed(2);raf=requestAnimationFrame(tick)}

  const goBtn=document.getElementById('go');

  // Plansza w spoczynku: puste kafelki, liczby losowane dopiero po Start.
  function reset(){
    cancelAnimationFrame(raf);running=false;next=1;errors=0;
    nextEl.textContent='1';timeEl.textContent='0.00';
    const b=getBest(n);bestEl.textContent=b?b.toFixed(2):'—';
    msg.className='msg';msg.textContent='Naciśnij Start — liczby pojawią się i ruszy stoper.';
    goBtn.textContent='Start';
    document.querySelectorAll('.sz').forEach(x=>x.setAttribute('aria-pressed',+x.dataset.n===n));
    board.style.gridTemplateColumns='repeat('+n+',1fr)';
    board.innerHTML='';
    for(let i=0;i<n*n;i++){
      const c=document.createElement('button');c.className='c blank';c.tabIndex=-1;c.setAttribute('aria-hidden','true');
      board.appendChild(c);
    }
  }

  function startGame(){
    reset();
    const cells=board.children;
    shuffle([...Array(n*n)].map((_,i)=>i+1)).forEach((v,i)=>{
      const c=cells[i];c.className='c';c.textContent=v;c.dataset.v=v;c.tabIndex=0;c.removeAttribute('aria-hidden');
      c.addEventListener('pointerdown',e=>{e.preventDefault();hit(c)});
      c.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();hit(c)}});
    });
    msg.textContent='Klikaj od 1 do '+(n*n)+'.';
    goBtn.textContent='Od nowa';
    running=true;start=performance.now();raf=requestAnimationFrame(tick);
  }

  function hit(c){
    if(!running)return;
    const v=+c.dataset.v;
    if(v!==next){
      errors++;c.classList.remove('wrong');void c.offsetWidth;c.classList.add('wrong');
      setTimeout(()=>c.classList.remove('wrong'),250);return;
    }
    c.classList.add('gone');c.setAttribute('aria-hidden','true');c.tabIndex=-1;
    next++;
    if(next>n*n){
      cancelAnimationFrame(raf);running=false;
      const t=(performance.now()-start)/1000;timeEl.textContent=t.toFixed(2);nextEl.textContent='✓';
      const b=getBest(n);let rec=false;
      if(!b||t<b){setBest(n,t);bestEl.textContent=t.toFixed(2);rec=true}
      msg.className='msg win';
      msg.textContent=(rec?'Nowy rekord! ':'Gotowe! ')+t.toFixed(2)+' s, błędy: '+errors+'.';
      goBtn.textContent='Start';
    } else nextEl.textContent=next;
  }

  document.querySelectorAll('.sz').forEach(b=>b.addEventListener('click',()=>{
    n=+b.dataset.n;try{localStorage.setItem('size',n)}catch(e){}reset()}));
  goBtn.addEventListener('click',startGame);
  reset();
})();
</script>

<script>
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
</body>
</html>
